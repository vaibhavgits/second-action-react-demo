name: Test Project
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        # To run your code on ubuntu vm, use "checkout" actions
      - name: Get Code
        uses: actions/checkout@v7

        # Since we are using ubuntu, NodeJS comes pre-installed with it
        # https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md
      - name: Install NodeJS
        uses: actions/setup-node
        with: 
          nodeVersion: 24

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test



      