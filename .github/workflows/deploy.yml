name: Deploy Project
on: [push, workflow_dispatch]
jobs:
  #job1
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Get code
      uses: actions/checkout@v7
    - name: Install NodeJS
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
    - name: Run tests
      run: npm test
  #job2
  deploy: 
    # Use "needs" keyword if you want to run yur jobs sequentially
    # needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Deploy project
        run: echo "Deploying.."